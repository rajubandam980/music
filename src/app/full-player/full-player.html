<div class="full-player">


<!-- TOP BAR -->

<div class="top">

<button
(click)="closePlayer()">
⌄
</button>


<h3>
Now Playing
</h3>


</div>




<!-- COVER IMAGE -->

<img
class="big-cover"
[src]="playerService.currentSong?.imageUrl">





<!-- SONG INFO -->

<div class="song-info">


<h1>
{{playerService.currentSong?.title}}
</h1>


<p>
{{playerService.currentSong?.artist}}
</p>


</div>





<!-- PROGRESS -->

<div class="progress">


<span>
{{formatTime(playerService.currentTime)}}
</span>



<input
type="range"

min="0"

[max]="playerService.duration"

[value]="playerService.currentTime"


(input)="
playerService.seek(
+$any($event.target).value
)
"



>



<span>
{{formatTime(playerService.duration)}}
</span>



</div>





<!-- CONTROLS -->

<div class="controls">


<button
[class.active]="playerService.shuffle"
(click)="playerService.toggleShuffle()">

🔀

</button>




<button
(click)="playerService.playPrevious()">

⏮

</button>





<button
class="main-play"

(click)="playerService.togglePlayPause()">


{{playerService.isPlaying ? '⏸':'▶'}}


</button>





<button
(click)="playerService.playNext()">

⏭

</button>





<button
[class.active]="playerService.repeat"
(click)="playerService.toggleRepeat()">

🔁

</button>



</div>





<!-- BOTTOM -->

<div class="bottom">


<button>
❤️
</button>


<button>
☰ Queue
</button>


</div>



</div>
